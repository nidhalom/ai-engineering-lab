[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eegnet-pytorch"
version = "0.1.0"
description = "Clean PyTorch reimplementation of EEGNet (Lawhern et al., 2018) with a small training loop and group-wise splits."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Nidhal Kissoum" }]
dependencies = ["torch>=2.2", "numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["eegnet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
