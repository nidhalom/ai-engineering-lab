[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-signal-toolkit"
version = "0.1.0"
description = "Small EEG preprocessing toolkit: filters, sliding windows, Welch band power and a from-scratch CSP."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Nidhal Kissoum" }]
dependencies = ["numpy>=2.0", "scipy>=1.11"]

[project.optional-dependencies]
demo = ["scikit-learn>=1.4"]
mne = ["mne>=1.6"]
test = ["pytest>=8", "scikit-learn>=1.4"]

[tool.setuptools]
packages = ["eeg_signal_toolkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
