name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.dir }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dir: eeg-bci/eeg-signal-toolkit, install: 'pip install -e ".[test]"', test: 'pytest -q' }
          - { dir: rag-llm/bm25-from-scratch, install: 'pip install -e ".[test]"', test: 'pytest -q' }
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: ${{ matrix.install }}
      - name: Test
        run: ${{ matrix.test }}
